# Nginx inside the container (the VPS Nginx forwards to it, like crazydev)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css image/svg+xml;

    location / { try_files $uri $uri/ =404; }
    location /assets/ { expires 7d; }
    error_page 404 /index.html;
}
